name: Deploy Application

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version number for the release (e.g. 1.0.0)'
        required: true
        type: string
        default: '1.0.0'

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-26.04, ubuntu-26.04-arm, macos-latest, windows-latest]

    steps:
    - name: Checkout Code
      uses: actions/checkout@v7
      with:
        submodules: recursive
    
    - name: Setup MSVC (Windows)
      if: runner.os == 'Windows'
      uses: TheMrMilchmann/setup-msvc-dev@v4
      with:
        arch: x64

    - name: Install bgfx
      uses: alemuntoni/install-bgfx-cmake@v1

    - name: Install System Dependencies (Linux)
      if: runner.os == 'Linux'
      run: |
        sudo apt-get update
        sudo apt-get install -y patchelf libtbb-dev libembree-dev \
          freeglut3-dev libgl1-mesa-dev libxi-dev libxinerama-dev libxcursor-dev \
          libxrandr-dev libboost-dev libcgal-dev libwayland-dev wayland-protocols \
          libxkbcommon-dev mesa-vulkan-drivers
        sudo apt-get install -y qt6-base-dev qt6-tools-dev qt6-l10n-tools qt6-3d-dev qt6-svg-dev

    - name: Install System Dependencies (macOS)
      if: runner.os == 'macOS'
      run: |
        brew install embree gmp mpfr

    - name: Install Qt (Windows & macOS)
      if: runner.os != 'Linux'
      uses: jurplel/install-qt-action@v4
      with:
        cache: 'true'
        version: '6.10.*'

    - name: Build Application
      shell: bash
      run: |
        cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_PROJECT_VERSION=${{ github.event.inputs.version }}
        cmake --build build --config Release

    - name: Package (Windows)
      if: runner.os == 'Windows'
      shell: bash
      run: |
        cd build
        cpack -C Release -G ZIP

    - name: Package (macOS)
      if: runner.os == 'macOS'
      shell: bash
      run: |
        cd build
        cpack -C Release -G DragNDrop

    - name: Determine AppImageTool Arch
      id: arch
      if: runner.os == 'Linux'
      run: |
        if [ "$RUNNER_ARCH" == "ARM64" ]; then echo "arch=aarch64" >> $GITHUB_OUTPUT; else echo "arch=x86_64" >> $GITHUB_OUTPUT; fi
      shell: bash

    - name: Setup AppImageTool (Linux)
      if: runner.os == 'Linux'
      uses: AnimMouse/setup-appimage@v2
      with:
        filename: appimagetool
        url: "https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-${{ steps.arch.outputs.arch }}.AppImage"
        cache_key: ${{ matrix.os }}

    - name: Package (Linux)
      if: runner.os == 'Linux'
      shell: bash
      run: |
        cd build
        cpack -C Release -G "DEB;TGZ;AppImage"

    - name: Upload Artifacts
      uses: actions/upload-artifact@v7
      with:
        name: packages-${{ matrix.os }}
        path: |
          build/*.zip
          build/*.dmg
          build/*.deb
          build/*.tar.gz
          build/*.AppImage
          !build/linuxdeploy*.AppImage

  create_release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - name: Download all artifacts
      uses: actions/download-artifact@v8
      with:
        path: artifacts

    - name: Prepare Release Assets
      run: |
        mkdir -p release_assets
        find artifacts -type f -name '*.zip' -exec cp {} release_assets/ \;
        find artifacts -type f -name '*.dmg' -exec cp {} release_assets/ \;
        find artifacts -type f -name '*.deb' -exec cp {} release_assets/ \;
        find artifacts -type f -name '*.tar.gz' -exec cp {} release_assets/ \;
        find artifacts -type f -name '*.AppImage' -exec cp {} release_assets/ \;

    - name: Create GitHub Release
      uses: ncipollo/release-action@v1
      with:
        tag: v${{ github.event.inputs.version }}
        name: Release v${{ github.event.inputs.version }}
        draft: false
        prerelease: false
        artifacts: release_assets/*
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

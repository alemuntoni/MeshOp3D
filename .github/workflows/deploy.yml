name: Deploy Application

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version number for the release (e.g. 1.0.0)'
        required: true
        type: string
        default: '1.0.0'

jobs:
  build:
    uses: ./.github/workflows/build.yml
    with:
      version: ${{ github.event.inputs.version }}

  create_release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - name: Download all artifacts
      uses: actions/download-artifact@v8
      with:
        path: artifacts

    - name: Prepare Release Assets
      run: |
        mkdir -p release_assets
        find artifacts -type f -name '*.zip'      -exec cp {} release_assets/ \;
        find artifacts -type f -name '*.exe'      -exec cp {} release_assets/ \;
        find artifacts -type f -name '*.dmg'      -exec cp {} release_assets/ \;
        find artifacts -type f -name '*.deb'      -exec cp {} release_assets/ \;
        find artifacts -type f -name '*.tar.gz'   -exec cp {} release_assets/ \;
        find artifacts -type f -name '*.AppImage' -exec cp {} release_assets/ \;

    - name: Create GitHub Release
      uses: ncipollo/release-action@v1
      with:
        tag: v${{ github.event.inputs.version }}
        name: Release v${{ github.event.inputs.version }}
        draft: false
        prerelease: false
        artifacts: release_assets/*
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
